# /etc/needrestart/conf.d/klick.conf — nach Sicherheits-Updates betroffene Dienste
# automatisch neu starten (statt nur zu fragen). Die Apps (klick, both) und der
# Signer starten nicht automatisch neu: ein Neustart des Signers braucht keinen
# Eingriff, aber die Apps laufen nur nach einem Release neu (Runbook).
$nrconf{restart} = 'a';
$nrconf{override_rc}{qr(^klick\.service$)} = 0;
$nrconf{override_rc}{qr(^both\.service$)} = 0;
$nrconf{override_rc}{qr(^klick-signer\.service$)} = 0;
