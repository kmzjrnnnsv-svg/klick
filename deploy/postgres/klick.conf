# /etc/postgresql/16/main/conf.d/klick.conf — Postgres auf dem App-Server (Härtung H7)
# Ubuntu bindet conf.d ein (include_dir). Prüfen:
#   sudo -u postgres psql -c "select name, setting from pg_settings where name in
#     ('listen_addresses','password_encryption','ssl','log_connections','log_statement')"
# Neustart nötig für listen_addresses: systemctl restart postgresql

# Nur lokal: die Apps und Backups laufen auf demselben Server
listen_addresses = 'localhost'
port = 5432
max_connections = 100

# Passwörter nur als SCRAM (vor dem Umstellen alle Rollen-Passwörter neu setzen:
#   \password klick_app  … — md5-Hashes funktionieren danach nicht mehr)
password_encryption = scram-sha-256

# TLS auch lokal (Ubuntu-Zertifikat snakeoil, für spätere Fernzugriffe eigenes)
ssl = on
ssl_min_protocol_version = 'TLSv1.3'

# Protokoll: wer, wann, welche Strukturänderung — nie Werte (personenbezogene
# Daten in Parametern)
log_connections = on
log_disconnections = on
log_statement = 'ddl'
log_line_prefix = '%m [%p] %q%u@%d from %h app=%a '
log_lock_waits = on
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_error_statement = error

# Hängende Transaktionen beenden (Sperren, RLS-Kontext bleibt sonst liegen)
idle_in_transaction_session_timeout = '5min'

# Optional: pgaudit für Rollen- und Rechteänderungen (apt install postgresql-16-pgaudit)
#shared_preload_libraries = 'pgaudit'
#pgaudit.log = 'role, ddl'
#pgaudit.log_parameter = off
