# /etc/ssh/sshd_config.d/10-klick.conf — SSH auf dem App-Server (Härtung H3).
#
# Drei Schichten: Hetzner-Firewall (22 zu), nftables (22 nur auf wg-admin) und
# hier AllowUsers mit Quellnetz. Anmelden nur mit Sicherheitsschlüssel und PIN
# (FIDO2), keine Passwörter, kein root.
#
# Schlüssel auf dem Admin-Gerät:
#   ssh-keygen -t ed25519-sk -O resident -O verify-required -C "<name>@<gerät>"
# Datei kommt vor 50-cloud-init.conf; bei sshd gilt der erste Wert.
# Prüfen: sshd -t && sshd -T | grep -Ei 'pubkey|password|permitroot|allowusers'
# Umstellen nur mit zweiter offener Sitzung (Runbook „Server härten“).

# Wer und woher: <admin> durch die Admin-Konten ersetzen (je Person eins)
AllowUsers <admin>@10.9.0.0/24 <admin>@fd10:9::/64

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PubkeyAcceptedAlgorithms sk-ssh-ed25519@openssh.com,sk-ecdsa-sha2-nistp256@openssh.com
PubkeyAuthOptions verify-required touch-required
AuthorizedKeysFile .ssh/authorized_keys

# Nur Host-Schlüssel Ed25519
HostKey /etc/ssh/ssh_host_ed25519_key

# Algorithmen (OpenSSH 9.6, Ubuntu 24.04): hybrid post-quanten zuerst
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Weiterleitungen: nur der Sprung zum Knoten-Server (ssh -J), sonst nichts
AllowTcpForwarding local
PermitOpen 10.8.0.2:22
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no

# Grenzen und Protokoll
MaxAuthTries 3
MaxSessions 4
MaxStartups 4:50:10
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
