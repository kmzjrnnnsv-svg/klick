# both.money — nginx (gehärtet), App auf 127.0.0.1:3010 (both.service)
#
# Ablage: /etc/nginx/sites-available/both.money.conf → sites-enabled
# Zertifikat: certbot certonly --webroot -w /var/www/letsencrypt -d both.money -d www.both.money
# Test:   nginx -t && systemctl reload nginx
#
# Sicherheits-Header kommen aus der App (CSP mit Nonce, COOP, CORP …), nginx
# ergänzt HSTS. Die App läuft nur unter https://both.money (Passkeys und
# Sitzungs-Cookies hängen am Host), www leitet um.

limit_req_zone $binary_remote_addr zone=both_global:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=both_auth:10m rate=10r/m;
# Bestätigungsseite → Relay (Absicht lesen, Bestätigung weiterreichen)
limit_req_zone $binary_remote_addr zone=both_relay:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=both_conn:10m;

map $http_x_request_id $both_request_id {
    default   $http_x_request_id;
    ""        $request_id;
}

server {
    listen 80;
    listen [::]:80;
    server_name both.money www.both.money;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://both.money$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.both.money;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/both.money/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/both.money/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    return 301 https://both.money$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name both.money;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/both.money/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/both.money/privkey.pem;

    # Mozilla "intermediate"
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:BOTH_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Kein OCSP-Stapling: Let's Encrypt stellt seit 2025 keine OCSP-Antworten mehr aus

    # HSTS ohne preload/includeSubDomains, bis approve.both.money steht
    add_header Strict-Transport-Security "max-age=63072000" always;

    limit_conn both_conn 30;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;

    proxy_set_header X-Request-ID $both_request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;

    location = /api/health {
        proxy_pass http://127.0.0.1:3010;
        access_log off;
    }

    location ~* ^/(_next/static|favicon\.ico|icons/|.*\.(?:svg|png|jpg|jpeg|gif|webp|woff2?|ttf|otf)$) {
        proxy_pass http://127.0.0.1:3010;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Optionale Netz-Sperre der Plattform (Härtung W): Muster, damit nginx
    # ohne Datei startet; Vorlage snippets/both-allow.conf.example. Relay,
    # Link-Tausch, Health und statische Dateien bleiben offen.

    # Passkey-Anmeldung, Aktivierung, Links: 10 Anfragen/Minute je IP
    location /api/auth/ {
        include /etc/nginx/snippets/both-allow*.conf;
        limit_req zone=both_auth burst=10 nodelay;
        limit_conn both_conn 10;
        proxy_pass http://127.0.0.1:3010;
    }
    location = /api/link {
        limit_req zone=both_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3010;
    }

    # Relay der Bestätigungsseite (Herkunft prüft die App, Inhalt der Signer)
    location ~ ^/api/(confirm|enrol)/ {
        limit_req zone=both_relay burst=20 nodelay;
        limit_conn both_conn 5;
        proxy_pass http://127.0.0.1:3010;
    }

    location / {
        include /etc/nginx/snippets/both-allow*.conf;
        limit_req zone=both_global burst=60 nodelay;
        proxy_pass http://127.0.0.1:3010;
        proxy_read_timeout 60s;
    }
}
