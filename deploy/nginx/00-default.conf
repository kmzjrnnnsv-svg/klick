# /etc/nginx/sites-available/00-default.conf → sites-enabled (Härtung H6)
#
# Unbekannte Host-Header (IP-Scans, fremde Domains auf unserer IP) bekommen
# keine Antwort: HTTP schließt die Verbindung (444), TLS lehnt den Handshake ab,
# ohne ein Zertifikat zu zeigen (verrät sonst raza.work/both.money).
# Vorher prüfen, dass kein anderer vHost default_server trägt:
#   grep -rn default_server /etc/nginx/sites-enabled/
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    access_log off;
    ssl_reject_handshake on;
}
