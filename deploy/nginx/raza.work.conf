# Klick @ raza.work — nginx (gehärtet)
#
# Ablage: /etc/nginx/sites-available/raza.work.conf → sites-enabled
# Test:   nginx -t && systemctl reload nginx
#
# Sicherheits-Header kommen aus der App (next.config.ts: CSP, COOP, CORP,
# Permissions-Policy …). nginx ergänzt nur Transport-nahe Header (HSTS).
# Rate-Limits: Auth-Endpunkte eng, Rest großzügig; Health ohne Limit.

limit_req_zone $binary_remote_addr zone=klick_global:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=klick_auth:10m rate=10r/m;
# CI-Ingest (ADR-017): wenige große Uploads je IP; die App begrenzt zusätzlich
# je Token (30/min) und je Org
limit_req_zone $binary_remote_addr zone=klick_ingest:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=klick_conn:10m;
# Öffentliche Formulare ohne Konto (Anfrage, NDA, Richtlinien-Portal: Code und
# Anmeldung): eng je IP; die App begrenzt zusätzlich je Adresse
limit_req_zone $binary_remote_addr zone=klick_forms:10m rate=10r/m;

map $http_x_request_id $klick_request_id {
    default   $http_x_request_id;
    ""        $request_id;
}

server {
    listen 80;
    listen [::]:80;
    server_name raza.work www.raza.work;
    server_tokens off;
    return 301 https://raza.work$request_uri;
}

# www → Apex: Die App läuft nur unter BETTER_AUTH_URL (https://raza.work).
# Better Auth lehnt Anmeldungen von anderen Origins ab (403 INVALID_ORIGIN —
# „Anmelde-Link senden“ scheitert), Sitzungs-Cookies und Passkeys hängen am Host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.raza.work;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/raza.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raza.work/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 301 https://raza.work$request_uri;
}

server {
    # `listen … http2` statt `http2 on;`: läuft auch auf nginx 1.24 (Ubuntu 24.04),
    # ab 1.25.1 nur eine Deprecation-Warnung.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name raza.work;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/raza.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raza.work/privkey.pem;

    # Mozilla "intermediate"
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:KLICK_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Kein OCSP-Stapling: Let's Encrypt stellt seit 2025 keine OCSP-Antworten mehr aus

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    limit_conn klick_conn 50;
    client_max_body_size 26m;
    client_body_timeout 15s;
    client_header_timeout 10s;

    # Request-ID durchreichen (pino-Korrelation)
    proxy_set_header X-Request-ID $klick_request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;

    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location ~* ^/(_next/static|favicon\.ico|icons/|.*\.(?:svg|png|jpg|jpeg|gif|webp|woff2?|ttf|otf)$) {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Auth (Magic-Link, 2FA, Passkeys): 10 Anfragen/Minute je IP
    location /api/auth/ {
        limit_req zone=klick_auth burst=10 nodelay;
        limit_conn klick_conn 10;
        proxy_pass http://127.0.0.1:3000;
    }

    # Admin nur aus dem Admin-Netz (WireGuard, Härtung H6). Die App prüft
    # zusätzlich selbst (ADMIN_NETWORKS): Server-Actions lassen sich über jede
    # Seite aufrufen, nginx sieht nur den Pfad.
    location = /admin {
        include /etc/nginx/snippets/klick-admin-net.conf;
        proxy_pass http://127.0.0.1:3000;
    }
    location ^~ /admin/ {
        include /etc/nginx/snippets/klick-admin-net.conf;
        limit_req zone=klick_global burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location ^~ /api/admin/ {
        include /etc/nginx/snippets/klick-admin-net.conf;
        limit_req zone=klick_global burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    # Better-Auth-Admin (Konten, Rollen, Sperren, Impersonation)
    location ^~ /api/auth/admin/ {
        include /etc/nginx/snippets/klick-admin-net.conf;
        limit_req zone=klick_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Formulare ohne Konto: Anfrage, NDA-Anfrage im Trust Center, Einmal-Code
    # und Anmeldung im Richtlinien-Portal
    location ~ ^/(api/anfrage|api/vertrauen/anfrage|portal/[^/]+/(code|anmelden))$ {
        limit_req zone=klick_forms burst=5 nodelay;
        limit_conn klick_conn 5;
        proxy_pass http://127.0.0.1:3000;
    }

    # CI-Ingest (Bearer-Token, keine Cookies): Scan-Berichte und SBOMs bis 25 MB
    location /api/ingest/ {
        limit_req zone=klick_ingest burst=20 nodelay;
        limit_conn klick_conn 5;
        limit_except POST { deny all; }
        client_max_body_size 26m;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 120s;
    }

    # Nachweis-Stream (verschlüsselt → entschlüsselt): kein Buffering
    location /api/nachweise/ {
        limit_req zone=klick_global burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_req zone=klick_global burst=120 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }
}
