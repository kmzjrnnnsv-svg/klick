# Klick @ raza.work — nginx (gehärtet)
#
# Ablage: /etc/nginx/sites-available/raza.work.conf → sites-enabled
# Test:   nginx -t && systemctl reload nginx
#
# Sicherheits-Header kommen aus der App (next.config.ts: CSP, COOP, CORP,
# Permissions-Policy …). nginx ergänzt nur Transport-nahe Header (HSTS).
# Rate-Limits: Auth-Endpunkte eng, Rest großzügig; Health ohne Limit.

limit_req_zone $binary_remote_addr zone=klick_global:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=klick_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=klick_conn:10m;

map $http_x_request_id $klick_request_id {
    default   $http_x_request_id;
    ""        $request_id;
}

server {
    listen 80;
    listen [::]:80;
    server_name raza.work www.raza.work;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name raza.work www.raza.work;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/raza.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raza.work/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/raza.work/chain.pem;

    # Mozilla "intermediate"
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:KLICK_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    limit_conn klick_conn 50;
    client_max_body_size 26m;
    client_body_timeout 15s;
    client_header_timeout 10s;

    # Request-ID durchreichen (pino-Korrelation)
    proxy_set_header X-Request-ID $klick_request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;

    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location ~* ^/(_next/static|favicon\.ico|icons/|.*\.(?:svg|png|jpg|jpeg|gif|webp|woff2?|ttf|otf)$) {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Auth (Magic-Link, 2FA, Passkeys): 10 Anfragen/Minute je IP
    location /api/auth/ {
        limit_req zone=klick_auth burst=10 nodelay;
        limit_conn klick_conn 10;
        proxy_pass http://127.0.0.1:3000;
    }

    # Nachweis-Stream (verschlüsselt → entschlüsselt): kein Buffering
    location /api/nachweise/ {
        limit_req zone=klick_global burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_req zone=klick_global burst=120 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }
}
