# both.money · Bestätigungsseite approve.both.money (Plan both.money, W3)
#
# Statische Seite auf eigener Herkunft: Auszahlungen und Zieladressen werden
# hier mit einem Sicherheitsschlüssel bestätigt. Sie zeigt den Text der
# Absicht selbst an und rechnet die Challenge im Browser — eine übernommene
# App kann so keine gültige Bestätigung erzeugen.
#
# Regeln: nur TLS 1.3, eigenes Zertifikat, nur GET/HEAD, nie ein proxy_pass,
# kein Wildcard-DNS, Dateien root-eigen (deploy/signer/install.sh).
# Ablage: /etc/nginx/sites-available/approve.both.money.conf → sites-enabled
# Zertifikat: certbot certonly --webroot -w /var/www/letsencrypt -d approve.both.money

server {
    listen 80;
    listen [::]:80;
    server_name approve.both.money;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://approve.both.money$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name approve.both.money;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/approve.both.money/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/approve.both.money/privkey.pem;

    # nur TLS 1.3 (BSI TR-02102-2); Haupt-vhost behält 1.2 + 1.3
    ssl_protocols TLSv1.3;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_session_cache shared:BOTH_CONFIRM_SSL:1m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    # Kein OCSP-Stapling: Let's Encrypt stellt seit 2025 keine OCSP-Antworten mehr aus

    root /var/www/approve;
    index index.html;
    charset utf-8;
    client_max_body_size 1k;

    # Header für jede Antwort (keine add_header in location-Blöcken, sonst
    # fallen diese weg)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://both.money; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "publickey-credentials-get=(self), publickey-credentials-create=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Cache-Control "no-cache" always;

    # keine fremden RP-IDs über diese Herkunft (WebAuthn Related Origins)
    location = /.well-known/webauthn {
        return 404;
    }
    location ^~ /.well-known/ {
        return 404;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri =404;
    }
}
