# /etc/systemd/system/clamav-daemon.service.d/klick.conf — Grenzen für clamd
# (deploy/rollout, Phase virenscanner). clamd hält die Signaturen im Speicher
# (≈ 1–1,5 GB); mit `ConcurrentDatabaseReload no` in clamd.conf lädt es beim
# Update nicht doppelt. Ein Leck oder eine Spitze nimmt Klick nicht den Host.
[Service]
MemoryHigh=1600M
MemoryMax=2G
MemorySwapMax=512M
