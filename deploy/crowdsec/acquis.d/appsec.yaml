# /etc/crowdsec/acquis.d/appsec.yaml — WAF (AppSec-Komponente, Härtung H6)
# Der nginx-Bouncer schickt jede Anfrage vorab an 127.0.0.1:7422; Regeln aus
# crowdsecurity/appsec-virtual-patching (bekannte Lücken) und
# crowdsecurity/appsec-generic-rules (generische Angriffsmuster).
appsec_config: crowdsecurity/appsec-default
labels:
  type: appsec
listen_addr: 127.0.0.1:7422
source: appsec
