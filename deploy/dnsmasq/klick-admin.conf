# /etc/dnsmasq.d/klick-admin.conf — DNS nur im Admin-Netz (Härtung H1).
# Admin-Geräte im Tunnel bekommen für die eigenen Domains die Tunnel-Adresse;
# Anfragen landen so mit Quelladresse 10.9.0.x bei nginx und der App, die
# /admin und Plattform-Aktionen nur daraus annehmen. Alles andere fragt
# dnsmasq bei öffentlichen Resolvern nach.
#
#   apt install dnsmasq-base dnsmasq   (systemd-resolved belegt 127.0.0.53, nicht 10.9.0.1)
#   cp deploy/dnsmasq/klick-admin.conf /etc/dnsmasq.d/ && systemctl restart dnsmasq

# Nur im Tunnel lauschen, nie öffentlich (nftables lässt 53 nur auf wg-admin zu)
interface=wg-admin
bind-dynamic
except-interface=lo
no-dhcp-interface=wg-admin

# Keine lokalen Dateien als Quelle, nur die Weiterleitung unten
no-resolv
no-hosts
server=9.9.9.9
server=1.1.1.1
domain-needed
bogus-priv
stop-dns-rebind

# Eigene Domains im Tunnel (Subdomains eingeschlossen: www, approve, freigabe)
address=/raza.work/10.9.0.1
address=/raza.work/fd10:9::1
address=/both.money/10.9.0.1
address=/both.money/fd10:9::1

log-facility=/var/log/dnsmasq.log
