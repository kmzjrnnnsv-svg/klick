name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · tests (Postgres, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klick_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      VAULT_KEK_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgres://klick_test_app:klick_test_app@localhost:5432/klick_test
      DATABASE_URL_MIGRATE: postgres://postgres:postgres@localhost:5432/klick_test
      DATABASE_URL_TEST: postgres://klick_test_app:klick_test_app@localhost:5432/klick_test
      KLICK_DISABLE_JOBS: "true"
      # both.money (apps/wallet): eigene Test-DB wallet_test
      WALLET_DATABASE_URL: postgres://wallet_test_app:wallet_test_app@localhost:5432/wallet_test
      WALLET_DATABASE_URL_MIGRATE: postgres://postgres:postgres@localhost:5432/wallet_test
      WALLET_DATABASE_URL_TEST: postgres://wallet_test_app:wallet_test_app@localhost:5432/wallet_test
      WALLET_AUTH_URL: http://localhost:3400
      WALLET_AUTH_SECRET: ci-only-wallet-secret-0123456789abcdef0123456789
      WALLET_VAULT_KEK_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      WALLET_DISABLE_JOBS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile, Release-Cooldown)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test-Rolle ohne BYPASSRLS anlegen
        run: |
          psql "$DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 -c "CREATE ROLE klick_test_app LOGIN PASSWORD 'klick_test_app' NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE;"
      - name: Migration (0000_pivot) auf Test-DB
        run: pnpm db:migrate
      - name: Grants für Test-Rolle + pgboss-Schema
        run: |
          psql "$DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO klick_test_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO klick_test_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO klick_test_app;
          CREATE SCHEMA IF NOT EXISTS pgboss AUTHORIZATION klick_test_app;
          SQL
      - name: Seed (idempotent, als App-Rolle)
        run: pnpm db:seed
      - name: both.money — Test-DB, Rolle, Migration, Grants
        run: |
          psql "$DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE wallet_test_app LOGIN PASSWORD 'wallet_test_app' NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE wallet_test;
          SQL
          pnpm db:wallet:migrate
          psql "$WALLET_DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO wallet_test_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wallet_test_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO wallet_test_app;
          CREATE SCHEMA IF NOT EXISTS pgboss AUTHORIZATION wallet_test_app;
          SQL
      - name: Migrations-Drift (Schema ↔ Migrationen, Klick und both.money)
        run: |
          pnpm exec drizzle-kit generate --name ci-drift
          pnpm db:wallet:generate --name ci-drift
          test -z "$(git status --porcelain db/migrations apps/wallet/db/migrations)" || { git status --porcelain db/migrations apps/wallet/db/migrations; echo "Schema und Migrationen weichen ab — pnpm db:generate bzw. db:wallet:generate ausführen"; exit 1; }
      - name: Tests (Unit + RLS-Integration)
        run: pnpm test
      - name: Signer bündeln (SHA-256 für deploy/signer/install.sh)
        run: |
          pnpm build:signer
          echo "### Signer" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/signer.mjs.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  wallet-build:
    name: both.money (apps/wallet) — Build + Start
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WALLET_AUTH_URL: http://localhost:3410
      WALLET_DISABLE_JOBS: "true"
      # Start ohne Datenbank-Zugriff: Health/CSP fragen keine DB ab
      WALLET_DATABASE_URL: postgres://wallet_app@localhost:5432/wallet
      WALLET_AUTH_SECRET: ci-only-wallet-secret-0123456789abcdef0123456789
      WALLET_VAULT_KEK_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:wallet
      - name: Start + Health + CSP mit Nonce
        run: |
          pnpm exec next start apps/wallet -p 3410 > wallet.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:3410/api/health && break; sleep 1; done
          curl -fs http://localhost:3410/api/health | grep -q '"service":"both.money"'
          curl -fsD headers.txt http://localhost:3410/ -o page.html
          grep -qi "^content-security-policy:.*'nonce-" headers.txt
          grep -q 'nonce="' page.html
      - if: failure()
        run: cat wallet.log || true

  supply-chain:
    name: pnpm audit · OSV · SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high
      - name: OSV-Scanner
        # Gepinnt: das Repo führt kein gleitendes v2-Tag (Set up job: „unable to find version v2").
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
      - name: SBOM (CycloneDX)
        run: pnpm sbom
      - uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Playwright (Header, Redirects, Login)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klick_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3100
      VAULT_KEK_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgres://klick_test_app:klick_test_app@localhost:5432/klick_test
      DATABASE_URL_MIGRATE: postgres://postgres:postgres@localhost:5432/klick_test
      KLICK_DISABLE_JOBS: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test-Rolle, Migration, Grants, Seed
        run: |
          psql "$DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 -c "CREATE ROLE klick_test_app LOGIN PASSWORD 'klick_test_app' NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          pnpm db:migrate
          psql "$DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO klick_test_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO klick_test_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO klick_test_app;
          CREATE SCHEMA IF NOT EXISTS pgboss AUTHORIZATION klick_test_app;
          SQL
          pnpm db:seed
      - name: Build
        run: pnpm build
      - name: JavaScript-Budget je Seite
        run: pnpm exec tsx scripts/check-bundle-budget.ts
      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  # Release-Artefakte (ADR-034): nur auf main nach grünen Tests. Der Server
  # holt sie mit deploy/rollout/artefakt.mjs und baut nicht mehr selbst. Gebaut
  # wird mit der echten Adresse (die Sitemap ist fest gerendert); geheime
  # Werte gibt es hier keine, nur Platzhalter wie in e2e.
  release-build:
    name: Release-Artefakte (Klick, both.money)
    # Ohne die Repo-Variablen übersprungen statt rot: der Server baut dann
    # nach Rückfrage selbst (Runbook „Release-Artefakt aus CI“)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KLICK_PUBLIC_URL != '' && vars.WALLET_PUBLIC_URL != ''
    needs: [check, e2e, wallet-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_URL: ${{ vars.KLICK_PUBLIC_URL }}
      WALLET_AUTH_URL: ${{ vars.WALLET_PUBLIC_URL }}
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      VAULT_KEK_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgres://klick_app@localhost:5432/klick
      KLICK_DISABLE_JOBS: "true"
      WALLET_DISABLE_JOBS: "true"
      WALLET_DATABASE_URL: postgres://wallet_app@localhost:5432/wallet
      WALLET_AUTH_SECRET: ci-only-wallet-secret-0123456789abcdef0123456789
      WALLET_VAULT_KEK_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Adressen gesetzt
        run: |
          if [ -z "$BETTER_AUTH_URL" ] || [ -z "$WALLET_AUTH_URL" ]; then
            echo "::error::Repo-Variablen KLICK_PUBLIC_URL und WALLET_PUBLIC_URL fehlen (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
      - name: Klick bauen
        run: pnpm build:parser && pnpm exec next build
      - name: both.money bauen
        run: pnpm exec next build apps/wallet
      - name: Packen
        # shell: bash = mit pipefail, sonst verdeckte tee einen Fehler beim Packen
        shell: bash
        run: |
          mkdir -p release
          node deploy/rollout/artefakt.mjs packen --app klick --out release | tee release/klick.txt
          node deploy/rollout/artefakt.mjs packen --app both --out release | tee release/both.txt
          echo "### Release-Artefakte" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat release/klick.txt release/both.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          path: release/klick-${{ github.sha }}.tar.gz
          archive: false
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: release/both-${{ github.sha }}.tar.gz
          archive: false
          retention-days: 30
          if-no-files-found: error
