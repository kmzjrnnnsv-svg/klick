title = "klick"
[extend]
useDefault = true
[allowlist]
paths = [
  '''pnpm-lock\.yaml''',
  '''\.env\.example''',
  '''db/migrations/.*\.sql''',
  # Übernommene Sicherheits-Skills (.claude/THIRD_PARTY.md): Beispiel-Payloads, keine Geheimnisse
  '''\.claude/skills/(owasp-security|sharp-edges|differential-review|spec-to-code-compliance|agentic-actions-auditor|insecure-defaults|auditing-code-for-vulnerabilities|reviewing-cryptography|auditing-supply-chain|hunting-web-backdoors|reviewing-code-changes|attacking-saml|testing-web-applications|testing-apis|exploiting-ssrf|15-blue-team-defense)/''',
]

# Eigene Token-Präfixe (ADR-017/019): Klick klk_…, both.money kwl_…
[[rules]]
id = "klick-token"
description = "Klick-Token (Einladung, Zurücksetzen, Aktivieren, Portal, Trust Center, CI, Wallet-Export)"
regex = '''\bklk_[a-z]+_[A-Za-z0-9_-]{32,}'''
keywords = ["klk_"]

[[rules]]
id = "both-money-link"
description = "both.money-Link-Token (Einladung, Zurücksetzen, Aktivieren)"
regex = '''\bkwl_(invite|recover|activate)_[A-Za-z0-9_-]{32,}'''
keywords = ["kwl_"]
